# Local full stack: database + backend + frontend. Start with `docker compose up -d --build`.
services:
  # PostgreSQL. The volume keeps the data between restarts (`docker compose down -v` wipes it).
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: energywatch
      POSTGRES_USER: energywatch
      POSTGRES_PASSWORD: energywatch
    volumes:
      - energywatch-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energywatch -d energywatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Quarkus backend. Not published on a host port: only the web service talks to it.
  # The QUARKUS_* variables map to the datasource properties (db is the service name used as hostname).
  api:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/energywatch
      QUARKUS_DATASOURCE_USERNAME: energywatch
      QUARKUS_DATASOURCE_PASSWORD: energywatch
    # Start only once the database accepts connections (the healthcheck above).
    depends_on:
      db:
        condition: service_healthy

  # nginx serving the built React app on http://localhost:3000 and proxying /api to the api service.
  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  # Optional, off by default (a "profile"): keeps the demo alive. Every 30 s it sends fresh readings
  # for the demo factory through the web service (the same path a browser uses) and acts as an
  # operator who handles old alerts. Needs the demo sites: run scripts/seed_demo.py once first.
  #   start:  docker compose --profile demo up -d        stop:  docker compose --profile demo stop simulator
  # The e2e stack never starts it (no profile is enabled there), so tests keep their own clean data.
  simulator:
    profiles: ["demo"]
    image: python:3.12-alpine
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/simulate_readings.py", "http://web"]
    # Comes back after a crash or a Docker restart; it also copes with the app not being up yet.
    restart: unless-stopped
    depends_on:
      - web

volumes:
  energywatch-db-data:
