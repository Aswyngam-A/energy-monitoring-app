# Runs on every push to main and on every pull request; the three jobs run in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Backend: compile, unit tests and integration tests. Docker is preinstalled on ubuntu-latest,
  # which Quarkus Dev Services needs to start PostgreSQL.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - run: ./mvnw verify -B
        working-directory: backend

  # Frontend: lint + typecheck + Jest (npm run check). `npm ci` installs exactly what the lockfile says.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  # End-to-end: start the whole stack with docker compose, then drive it with Playwright in a real browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
