server {
    listen 80;                       # port inside the container

    root /usr/share/nginx/html;      # where the built files are (COPY target)
    index index.html;

    # Single-page app: any URL that is not a real file gets index.html, and React Router takes over.
    location / {
       try_files $uri /index.html;
    }

    # Reverse proxy: forward API calls to the backend container (compose service name `api`).
    location /api/ {
        proxy_pass http://api:8080;
    }
}
